<style>
:root{
  --bg1:#e7f3fa; --bg2:#fbf7ef; --bg3:#eaf4e5;
  --ink:#1d1517; --muted:#6a5e60; --line:rgba(29,21,23,.10);
  --brand:#c41e22; --brand-d:#a3171b; --brand-text:#c41e22;
  --green:#3f9444; --price:#1d7a3b; --sky:#8dcae9; --gold:#e8b93c; --ask:#a86a12;
  --sel:rgba(232,185,60,.20);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.80); --glass-border:rgba(255,255,255,.85);
  --shadow:0 10px 34px rgba(29,21,23,.10); --shadow-sm:0 4px 14px rgba(29,21,23,.10);
  --danger:#b3261e; --r:20px;
  --blob1:#8dcae9; --blob2:#9fd08c; --blob3:#e8686c;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg1:#0f1a22; --bg2:#1a1517; --bg3:#111d14;
    --ink:#f4ecec; --muted:#b4a6a8; --line:rgba(255,255,255,.11);
    --brand:#d62b30; --brand-d:#b8222a; --brand-text:#ff7a7e;
    --green:#58b35d; --price:#5fd07f; --gold:#f0c85a; --ask:#f0b85a;
    --sel:rgba(240,200,90,.14);
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-border:rgba(255,255,255,.15);
    --shadow:0 10px 34px rgba(0,0,0,.40); --shadow-sm:0 4px 14px rgba(0,0,0,.30);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:"Cairo","Segoe UI",Tahoma,sans-serif; color:var(--ink); font-size:15px;
  background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3)); background-attachment:fixed;
  min-height:100vh; padding-bottom:calc(110px + env(safe-area-inset-bottom)); line-height:1.6;
}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
body::before{width:400px;height:400px;background:radial-gradient(circle,var(--blob1),transparent 70%);top:-130px;right:-110px;opacity:.65}
body::after{width:420px;height:420px;background:radial-gradient(circle,var(--blob2),transparent 70%);bottom:-150px;left:-130px;opacity:.45}
@media (prefers-color-scheme:dark){body::before{opacity:.28}body::after{opacity:.2}}
h1,h2,.disp{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-weight:800}
.glass{
  background:var(--glass); border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--shadow);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:var(--glass-strong)} }
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

/* hero */
.hero{margin:12px 0 8px;border-radius:28px;padding:18px 16px 14px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--brand) 0 55%,var(--green) 55% 80%,var(--sky) 80%)}
.logo{width:104px;height:104px;margin:4px auto 8px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 8px 24px rgba(29,21,23,.18)}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.hero h1{margin:0;font-size:clamp(27px,7.4vw,38px);line-height:1.25;color:var(--brand-text)}
.hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.step{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--glass-strong);border:1px solid var(--glass-border)}
.step b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg2);font-size:11px}
@media (prefers-color-scheme:dark){.step b{background:var(--gold);color:#1a1517}}

/* sticky top */
.top{position:sticky;top:0;z-index:20;padding:10px 0 8px}
.topin{border-radius:22px;padding:10px}
.search{position:relative}
.search input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 44px 12px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--glass-strong);outline:none;transition:box-shadow .2s,border-color .2s
}
.search input::placeholder{color:var(--muted);opacity:.85}
.search input:focus{border-color:#3f9bd0;box-shadow:0 0 0 3px rgba(63,155,208,.25)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .x{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:22px;padding:4px 10px;cursor:pointer;display:none;font-family:inherit}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 2px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14px;line-height:1.35;text-align:center;font-weight:700;color:var(--ink);cursor:pointer;
  padding:11px 8px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);transition:.18s}
.tab.on{background:var(--brand);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm)}
.tab small{display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:2px}
.tab.on small{opacity:.9}
.searching .tab{opacity:.5}

/* list */
.msec{margin:18px 2px 8px;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-weight:800;font-size:21px;color:var(--ink);display:flex;align-items:center;gap:10px;line-height:1.3}
.msec::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--brand)}
.msec::after{content:"";flex:1;height:1px;background:var(--line)}
.group{border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ghead{width:100%;display:flex;align-items:center;gap:10px;font:inherit;text-align:right;color:var(--ink);
  background:transparent;border:0;padding:13px 16px;cursor:pointer}
.ghead .gt{flex:1;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-weight:800;font-size:18px;line-height:1.3}
.cnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--glass-strong);border:1px solid var(--line);padding:1px 10px;border-radius:999px}
.badge{display:none;font-size:12px;font-weight:700;color:#fff;background:var(--green);padding:1px 10px;border-radius:999px}
.badge.on{display:inline-block}
.chev{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
.group.open .chev{transform:rotate(180deg)}
.gbody{display:none;padding:0 8px 8px}
.group.open .gbody{display:block}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 10px;
  border-top:1px solid var(--line);border-radius:0;transition:background .15s}
.gbody .row:first-child{border-top:0}
.row.sel{background:var(--sel);border-radius:14px;border-top-color:transparent}
.name{font-weight:700;font-size:15px;line-height:1.5;word-break:break-word}
.desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.price{margin-top:2px;font-weight:700;color:var(--price);font-size:16px}
.price small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}
.price.ask{color:var(--ask);font-size:13px;font-weight:600}
.ctrl{direction:ltr;display:flex;align-items:center;gap:6px}
.add,.step-btn{font:inherit;cursor:pointer;border:0}
.add{background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;padding:8px 18px;border-radius:12px;box-shadow:var(--shadow-sm);direction:rtl}
.add:active,.step-btn:active,.btn:active{transform:scale(.95)}
.step-btn{width:34px;height:34px;border-radius:11px;background:var(--glass-strong);color:var(--ink);font-size:20px;font-weight:700;
  border:1px solid var(--line);display:grid;place-items:center;line-height:1;padding:0}
.step-btn.plus{background:var(--brand);color:#fff;border-color:transparent}
.q{width:56px;height:34px;text-align:center;font:inherit;font-weight:700;font-size:16px;color:var(--ink);padding:0;border-radius:10px;border:1px solid var(--line);background:var(--glass-strong);outline:none;-moz-appearance:textfield}
.q:focus{border-color:#3f9bd0;box-shadow:0 0 0 3px rgba(63,155,208,.25)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border-radius:var(--r)}

/* cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;pointer-events:none}
.bar.on{display:block}
.barin{max-width:860px;margin:0 auto;border-radius:22px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px;pointer-events:auto}
.barinfo{flex:1;line-height:1.35}
.barinfo small{display:block;color:var(--muted);font-size:12.5px}
.barinfo b{font-size:18px;font-weight:700}
.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:700;font-size:15px;padding:12px 20px;color:#fff;background:var(--brand);box-shadow:var(--shadow-sm)}
.btn.wa{background:var(--green)}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,12,14,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  background:var(--glass-strong);animation:up .25s ease}
@media (prefers-color-scheme:light){.panel{background:rgba(255,255,255,.9)}}
@media (prefers-color-scheme:dark){.panel{background:rgba(28,24,26,.92)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet.on{align-items:center}.panel{border-radius:26px}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph h2{margin:0;font-size:26px;line-height:1.2;color:var(--brand-text)}
.close{font:inherit;background:var(--glass);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;padding:0;line-height:1}
.lines{border:1px solid var(--line);border-radius:16px;background:var(--glass);margin-bottom:14px;overflow:hidden}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .name{font-size:14px}
.line .sum{font-size:12.5px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--sel);font-weight:700;margin-bottom:14px}
.tot b{font-size:21px;white-space:nowrap}
.tot small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field label i{color:var(--danger);font-style:normal}
.field input,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:none}
.field input:focus,.field textarea:focus{border-color:#3f9bd0;box-shadow:0 0 0 3px rgba(63,155,208,.25)}
.field textarea{resize:vertical;min-height:70px}
.field.bad input{border-color:var(--danger)}
.err{display:none;color:var(--danger);font-size:12.5px;margin-top:4px;font-weight:600}
.field.bad .err{display:block}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.acts .btn{flex:1;min-width:140px}
.link{display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:13px;background:none;border:0;font-family:inherit;cursor:pointer;text-decoration:underline;width:100%}
.note{margin:18px 4px 0;text-align:center;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:80;
  background:rgba(29,21,23,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media print{.top,.bar,.sheet,.add,.ctrl,.toast,.steps{display:none!important}.gbody{display:block!important}body{background:#fff}.glass{box-shadow:none;background:#fff}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function norm(s){
  return String(s).toLowerCase()
    .replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

let items=[], mains=[], activeMain=null, query="";
let cart = load("vc_cart",{});
const openG = new Set();

function buildItems(raw){
  const seen={};
  items = raw.map(r=>{
    const base=r.main+"|"+r.sub+"|"+r.name; seen[base]=(seen[base]||0)+1;
    return {key:base+"#"+seen[base], main:r.main, sub:r.sub||"", name:r.name, desc:r.desc||"",
      price: typeof r.price==="number" ? r.price : null,
      norm: norm(r.name+" "+(r.desc||"")+" "+(r.sub||""))};
  });
  mains=[...new Set(items.map(i=>i.main))];
  if(!mains.includes(activeMain)) activeMain=mains[0];
  const keys=new Set(items.map(i=>i.key));
  for(const k of Object.keys(cart)) if(!keys.has(k)) delete cart[k];
  $("#cntNote").textContent = items.length+" صنف";
}

function renderTabs(){
  $("#tabs").innerHTML = mains.map(m=>{
    const p=m.split(" – ");
    return `<button class="tab ${m===activeMain?'on':''}" data-main="${esc(m)}">${esc(p[0])}<small>${items.filter(i=>i.main===m).length} صنف</small></button>`;
  }).join("");
}

function ctrlHTML(q){
  return q>0
    ? `<button class="step-btn" data-act="dec" aria-label="إنقاص">−</button><input class="q" type="text" inputmode="numeric" pattern="[0-9]*" value="${q}" aria-label="الكمية" data-qty><button class="step-btn plus" data-act="inc" aria-label="زيادة">+</button>`
    : `<button class="add" data-act="inc">+ أضف</button>`;
}
function priceHTML(it){
  return it.price==null ? `<div class="price ask">اسأل عن السعر</div>` : `<div class="price">${fmt(it.price)}<small>ج.م</small></div>`;
}

function render(){
  const tokens = norm(query).trim().split(/\s+/).filter(Boolean);
  document.body.classList.toggle("searching", tokens.length>0);
  const showMains = tokens.length ? mains : [activeMain];
  let html="", shown=0, gid=0;
  for(const m of showMains){
    const groups=new Map();
    items.forEach((it,i)=>{
      if(it.main!==m) return;
      if(tokens.length && !tokens.every(t=>it.norm.includes(t))) return;
      if(!groups.has(it.sub)) groups.set(it.sub,[]);
      groups.get(it.sub).push(i);
    });
    if(!groups.size) continue;
    html += `<div class="msec">${esc(m)}</div>`;
    for(const [sub,idxs] of groups){
      shown+=idxs.length;
      const gkey=m+"|"+sub;
      const open = tokens.length>0 || openG.has(gkey) || (gid===0 && !openG.has("__touched"));
      gid++;
      html += `<section class="group glass ${open?'open':''}" data-g="${esc(gkey)}" data-idx="${idxs.join(',')}">
        <button class="ghead"><span class="gt">${esc(sub||m)}</span><span class="badge"></span><span class="cnt">${idxs.length}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="gbody">${idxs.map(i=>{const it=items[i],q=cart[it.key]||0;
          return `<div class="row ${q?'sel':''}" data-i="${i}"><div class="info"><div class="name">${esc(it.name)}</div>${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}${priceHTML(it)}</div><div class="ctrl">${ctrlHTML(q)}</div></div>`}).join("")}</div>
      </section>`;
    }
  }
  $("#list").innerHTML = shown ? html : `<div class="empty glass">مفيش نتائج للبحث ده. جرّب كلمة تانية.</div>`;
  updateBadges(); updateBar();
}

function updateBadges(){
  document.querySelectorAll(".group").forEach(g=>{
    let c=0; g.dataset.idx.split(",").forEach(i=>{ if(cart[items[+i].key]) c++; });
    const b=g.querySelector(".badge"); b.textContent=c+" مختار"; b.classList.toggle("on",c>0);
  });
}
function totals(){
  let lines=0,pieces=0,sum=0,ask=0;
  for(const it of items){ const q=cart[it.key]; if(!q) continue; lines++; pieces+=q; if(it.price==null) ask++; else sum+=it.price*q; }
  return {lines,pieces,sum:Math.round(sum*100)/100,ask};
}
function updateBar(){
  const t=totals();
  $("#bar").classList.toggle("on",t.lines>0);
  $("#barCount").textContent = t.lines+" صنف · "+t.pieces+" قطعة"+(t.ask?" · "+t.ask+" بدون سعر":"");
  $("#barTotal").textContent = "الإجمالي: "+fmt(t.sum)+" ج.م";
}

function setQty(i,q,soft){
  const it=items[i]; q=Math.max(0,Math.min(9999,q|0));
  if(q) cart[it.key]=q; else delete cart[it.key];
  store("vc_cart",cart);
  const row=document.querySelector(`.row[data-i="${i}"]`);
  if(row){ row.classList.toggle("sel",q>0); if(!soft||q===0) row.querySelector(".ctrl").innerHTML=ctrlHTML(q); }
  updateBadges(); updateBar();
  if($("#sheet").classList.contains("on")){
    if(soft && q>0){
      const sm=document.querySelector(`.line[data-i="${i}"] .sum`);
      if(sm) sm.textContent = it.price==null ? "السعر عند الطلب" : q+" × "+fmt(it.price)+" = "+fmt(it.price*q)+" ج.م";
      sheetTotals();
    } else renderSheet();
  }
}

$("#list").addEventListener("click",e=>{
  const h=e.target.closest(".ghead");
  if(h){ const g=h.parentElement; g.classList.toggle("open"); openG.add("__touched");

  const b=e.target.closest("[data-act]"); if(!b) return;

["#list","#lines"].forEach(sel=>{
  const box=$(sel), isQ=el=>el.matches&&el.matches("input[data-qty]");
  box.addEventListener("focusin",e=>{ if(isQ(e.target)) e.target.select(); });

function normPhone(v){
  let d=norm(v).replace(/\D/g,"");
  if(d.startsWith("0020")) d="0"+d.slice(4); else if(d.startsWith("20")&&d.length===12) d="0"+d.slice(2);
  return d;
}
function validate(){
  const name=$("#cname").value.trim().replace(/[*_~`]/g,"");
  const phone=normPhone($("#cphone").value);
  const okN=name.length>=2, okP=/^01[0125]\d{8}$/.test(phone);
  $("#fName").classList.toggle("bad",!okN); $("#fPhone").classList.toggle("bad",!okP);
  if(!okN){ $("#cname").focus(); return null; }
  if(!okP){ $("#cphone").focus(); return null; }
  store("vc_cust",{name,phone});
  return {name,phone,notes:$("#cnotes").value.replace(/[*_~`]/g,"").trim()};
}

function buildMessage(c){
  const L=[]; let n=0, pieces=0, sum=0; const ask=[];
  const SEP="▬▬▬▬▬▬▬▬▬▬";
  const when=new Date().toLocaleString("en-GB",{timeZone:"Africa/Cairo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",", " -");
  L.push("🧾 *طلب جديد من قائمة الأسعار*","الشركة البيطرية","التاريخ: "+when,"");
  L.push("👤 *الاسم:* "+c.name,"📞 *الموبايل:* "+c.phone);
  const tree=new Map();
  items.forEach(it=>{ const q=cart[it.key]; if(!q) return;
    if(!tree.has(it.main)) tree.set(it.main,new Map());
    const s=tree.get(it.main); if(!s.has(it.sub)) s.set(it.sub,[]); s.get(it.sub).push([it,q]); });
  for(const [m,subs] of tree){
    L.push("",SEP,"*"+m+"*");
    for(const [sub,arr] of subs){
      if(sub) L.push("","_"+sub+"_");
      for(const [it,q] of arr){
        n++; pieces+=q;
        L.push("▪ *"+it.name+"*");
        if(it.price==null){ ask.push(it.name); L.push("الكمية "+q+" — السعر عند الطلب"); }
        else { const ln=Math.round(it.price*q*100)/100; sum+=ln; L.push("الكمية "+q+" × "+fmt(it.price)+" = "+fmt(ln)+" ج"); }
      }
    }
  }
  L.push("",SEP,"عدد الأصناف: "+n,"عدد القطع: "+pieces,"💰 *الإجمالي: "+fmt(sum)+" ج*");
  if(ask.length) L.push("","أصناف سعرها عند الطلب (غير محسوبة في الإجمالي): "+ask.join("، "));
  if(c.notes) L.push("","*ملاحظات:* "+c.notes);
  return L.join("\n");
}

function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===',') { r.push(f); f=""; }
    else if(c==='\n'){ r.push(f); rows.push(r); r=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
async function loadSheet(){
  if(!SHEET_CSV_URL) return;
  try{
    const res=await fetch(SHEET_CSV_URL,{cache:"no-store"}); if(!res.ok) throw new Error(res.status);
    const rows=parseCSV(await res.text()).slice(1);
    const raw=rows.filter(r=>r[0]&&r[0].trim()&&r[2]&&r[2].trim()).map(r=>{
      const v=parseFloat(String(r[4]||"").replace(/,/g,""));
      return {main:r[0].trim(),sub:(r[1]||"").trim(),name:r[2].trim(),desc:(r[3]||"").trim(),price:isNaN(v)?"":v};
    });
    if(raw.length<5) throw new Error("empty");
    buildItems(raw); renderTabs(); render();
  }catch(e){ console.warn("تعذر تحميل الشيت، استخدمنا الأسعار المضمنة",e); }
}

(function(){ buildItems(DATA); renderTabs(); render(); loadSheet(); })();
</script>
</body>
