<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة شغل عبدالفتاح</title>
<meta name="theme-color" content="#0f4254">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#f6f7f8;--sf:#fff;--bd:#e4e8ea;--bd2:#d3d9dc;--tx:#16262c;--mt:#66767e;--pr:#0f4254;--pr2:#0b3341;--prt:#e7f0f3;--dg:#b42318;--ok:#067647;
--sh:0 1px 2px rgba(16,40,50,.05);--sh2:0 6px 18px rgba(16,40,50,.10);--r:8px;
--font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--bd)}
.tw{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:18px}
.brand h1{margin:0;font-size:16px;line-height:1.2;font-weight:700;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--mt);line-height:1.2;display:block}
.search{flex:1;max-width:460px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:0 10px;height:38px;color:var(--mt);transition:border-color .15s,box-shadow .15s,background .15s}
.search:focus-within{background:#fff;border-color:var(--pr);box-shadow:0 0 0 3px rgba(15,66,84,.12)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;color:var(--tx)}
kbd{font:600 11px var(--font);direction:ltr;border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:#fff;color:var(--mt);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--bg);border-color:#bfc8cc}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.pri:hover{background:var(--pr2)}
.btn.dg{background:var(--dg);border-color:var(--dg);color:#fff}
.btn.dg:hover{background:#912018}
.ib{width:36px;height:36px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:grid;place-items:center;font-size:18px;color:var(--mt)}
.ib:hover{background:var(--bg);color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--bd2);background:#fff;font-size:12.5px;color:var(--mt)}
.pill i{width:7px;height:7px;border-radius:50%;background:#aab4b9}
.pill.on{color:var(--ok);border-color:#b7dfc9;background:#f0faf4}
.pill.on i{background:#12b76a}

/* layout */
main{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
#nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nv{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--bd);background:#fff;font-size:12.5px;color:var(--mt)}
.nv:hover{color:var(--tx);border-color:var(--bd2)}
.nv b{font-weight:600;color:var(--pr);font-size:11.5px}

.blk{margin-bottom:18px}
.bh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mt);margin:0 2px 8px}
.bh svg{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 12px;border:1px solid var(--bd);background:#fff;border-radius:99px;text-decoration:none;color:var(--tx);font-size:13px;max-width:100%;transition:border-color .15s,box-shadow .15s}
.chip:hover{border-color:var(--pr);box-shadow:var(--sh)}
.chip .ic{width:18px;height:18px;border-radius:5px;font-size:12px}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}

/* sections */
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;box-shadow:var(--sh);--ac:#64748b;--acb:#eef1f4}
.sec.w6{--ac:#0f766e;--acb:#e3f3f1}
.sec.wel{--ac:#a15c07;--acb:#fbf0e0}
.sec.dr{opacity:.45}
.sec.ov{box-shadow:0 0 0 2px var(--pr)}
.sh{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 12px}
.gh{width:22px;height:30px;display:grid;place-items:center;color:#b3bcc1;cursor:grab;font-size:15px;border-radius:5px}
.gh:hover{color:var(--mt);background:var(--bg)}
.tg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 2px;text-align:start;border-radius:6px}
.chev{font-size:15px;color:var(--mt);transition:transform .22s}
.sec.c .chev{transform:rotate(90deg)}
.gi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:var(--acb);color:var(--ac);flex:none}
.tg h2{margin:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:12px;color:var(--mt);background:var(--bg);border-radius:99px;padding:0 8px;line-height:20px;flex:none}
.acc{font-size:11.5px;color:var(--ac);direction:ltr;unicode-bidi:isolate;white-space:nowrap;opacity:.9}
.sa{display:flex;gap:4px;align-items:center}
.bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease}
.sec.c .bd{grid-template-rows:0fr}
.in{overflow:hidden;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:2px 12px 14px;min-height:20px}
.grid.ov{background:var(--prt);border-radius:0 0 10px 10px}

/* cards */
.card{position:relative;display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--bd);border-radius:var(--r);background:#fff;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.card:hover,.card:focus-within{border-color:var(--pr);box-shadow:var(--sh2);transform:translateY(-1px)}
.card.dr{opacity:.4}
.card.ov{border-color:var(--pr);box-shadow:0 0 0 2px rgba(15,66,84,.2)}
.ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px;flex:none;background:#eef1f4;color:#546168;overflow:hidden}
.ic img{width:20px;height:20px;border-radius:3px}
.k-sheet .ic{background:#e6f4ea;color:#1e8e3e}
.k-doc .ic{background:#e8f0fe;color:#1a73e8}
.k-code .ic{background:#efebfa;color:#6a4fc4}
.k-mail .ic{background:#fdecea;color:#c5372c}
.k-drive .ic{background:#fff4d6;color:#a87500}
.k-app .ic{background:var(--prt);color:var(--pr)}
.k-tool .ic{background:#eef1f4;color:#47555c}
.tx{min-width:0;flex:1;display:block}
.tx b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;font-size:11.5px;color:var(--mt);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{position:absolute;inset-block:0;inset-inline-end:0;display:flex;align-items:center;gap:1px;padding-inline:6px 8px;border-radius:var(--r);opacity:0;transition:opacity .15s;background:linear-gradient(to right,#fff 70%,rgba(255,255,255,0))}
[dir=rtl] .acts{background:linear-gradient(to right,#fff 70%,rgba(255,255,255,0))}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.acts button{width:28px;height:28px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;font-size:15px;color:var(--mt)}
.acts button:hover{background:var(--bg);color:var(--tx)}
.acts button.fv.on{color:#d49a00}
.acts button.fv.on svg{fill:currentColor}
.acts button.rm:hover{color:var(--dg);background:#fdecea}
.empty{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--mt);padding:10px 4px;font-size:13px}
.empty .sm{margin-inline-start:auto}
.sm{border:1px dashed var(--bd2);background:transparent;border-radius:6px;padding:3px 10px;font-size:12.5px;color:var(--pr)}
.newsec{width:100%;height:46px;border:1px dashed var(--bd2);background:transparent;border-radius:10px;color:var(--mt);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.newsec:hover{border-color:var(--pr);color:var(--pr);background:#fff}
.none{text-align:center;color:var(--mt);padding:60px 0}

/* modal */
#mw{position:fixed;inset:0;z-index:60;background:rgba(14,30,37,.42);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s}
#mw.on{opacity:1;pointer-events:auto}
.sheet{background:#fff;border-radius:12px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(14,30,37,.28);transform:translateY(10px) scale(.98);transition:transform .2s;max-height:calc(100vh - 32px);overflow:auto}
#mw.on .sheet{transform:none}
.sheet h3{margin:0;padding:16px 18px 4px;font-size:16px}
.sheet .bdy{padding:8px 18px 4px}
.sheet label{display:block;font-size:12.5px;font-weight:500;color:var(--mt);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;height:40px;padding:0 11px;border:1px solid var(--bd2);border-radius:var(--r);background:#fff;outline:0}
.sheet input:focus,.sheet select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(15,66,84,.12)}
.sheet input[dir=ltr]{text-align:left}
.hint{font-size:12px;color:var(--mt);margin-top:8px;direction:rtl}
.hint bdi{direction:ltr}
.ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 16px;flex-direction:row-reverse;justify-content:flex-start}
.sheet p{margin:0;padding:6px 0 2px;color:var(--tx)}

/* popover */
#pop{position:fixed;z-index:50;min-width:210px;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh2);padding:5px;display:none}
#pop.on{display:block;animation:pp .14s ease}
@keyframes pp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#pop button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:8px 10px;border-radius:6px;text-align:start;font-size:13.5px}
#pop button:hover{background:var(--bg)}
#pop button.dg{color:var(--dg)}
#pop button svg{font-size:15px;color:var(--mt)}
#pop hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
#pop button[disabled]{opacity:.45;cursor:not-allowed}

/* toasts */
#ts{position:fixed;z-index:80;bottom:20px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#16262c;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;box-shadow:var(--sh2);animation:ti .2s ease;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--dg)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(hover:none){.acts{opacity:1}}
@media(max-width:760px){
 .tw{flex-wrap:wrap;padding:10px 14px;gap:8px}
 .brand{order:1;flex:1}
 .brand .sub{display:none}
 .search{order:3;flex-basis:100%;max-width:none;margin:0}
 .search kbd,.pill{display:none}
 .btn.pri span{display:none}
 .btn.pri{width:36px;padding:0;justify-content:center}
 main{padding:14px 14px 80px}
 .grid{grid-template-columns:1fr;padding-inline:10px}
 .acc{display:none}
 #mw{align-items:flex-end;padding:0}
 .sheet{max-width:none;border-radius:16px 16px 0 0;transform:translateY(30px)}
 html{scroll-padding-top:120px}
 .sa .sm{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 if(/docs\.google\.com\/(document|presentation)/.test(u))return'doc';
 if(/script\.google\.com/.test(u))return'code';

   '</div></div></div></section>';
 });
 if(!s)h+='<button type="button" class="newsec" data-act="newg">'+ico('plus')+'قسم جديد</button>';
 else if(!h)h='<div class="none">مفيش نتائج لـ «'+esc($('q').value.trim())+'»</div>';

 var v=$('vo');v.className='pill'+(VO?' on':'');v.lastChild.textContent=VO?'الفتح على الإيميل الصح: شغال':'الفتح على الإيميل الصح: متوقف';

function moveLink(from,to,g){
 var it=L[from];if(from===to)return;
 if(to!=null){var t=L[to];L.splice(from,1);var ti=L.indexOf(t);it.g=t.g;L.splice(ti,0,it)}
 else{L.splice(from,1);it.g=g;L.push(it)}
 persistL();draw();
}
function moveGroup(from,to){
 var a=order(),fi=a.indexOf(from),ti=a.indexOf(to);if(fi<0||ti<0||from===to)return;

}
function shift(gi,d){

/* drag & drop (links + sections) */
var DR=null,mEl=$('m');
function clr(){[].forEach.call(document.querySelectorAll('.ov,.dr'),function(n){n.classList.remove('ov','dr')})}
mEl.addEventListener('dragstart',function(e){
 var c=e.target.closest&&e.target.closest('.card[draggable]');
 if(c){DR={t:'l',i:+c.dataset.i};c.classList.add('dr');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','l')}catch(x){}return}
 var h=e.target.closest&&e.target.closest('.gh');
 if(h){var s=h.closest('section');DR={t:'g',g:+s.dataset.g};s.classList.add('dr');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','g');e.dataTransfer.setDragImage(s,30,20)}catch(x){}}
});
mEl.addEventListener('dragover',function(e){
 if(!DR)return;
 if(DR.t==='l'){
  var c=e.target.closest('section .card'),gr=e.target.closest('section .grid');
  if(!c&&!gr)return;e.preventDefault();
  [].forEach.call(mEl.querySelectorAll('.ov'),function(n){n.classList.remove('ov')});
  if(c)c.classList.add('ov');else gr.classList.add('ov');
 }else{
  var s=e.target.closest('section');if(!s)return;e.preventDefault();
  [].forEach.call(mEl.querySelectorAll('.ov'),function(n){n.classList.remove('ov')});
  if(+s.dataset.g!==DR.g)s.classList.add('ov');
 }
});
mEl.addEventListener('drop',function(e){
 if(!DR)return;e.preventDefault();var d=DR;DR=null;
 if(d.t==='l'){
  var c=e.target.closest('section .card'),gr=e.target.closest('section .grid');
  if(c&&c.dataset.i!=null)moveLink(d.i,+c.dataset.i);
  else if(gr){moveLink(d.i,null,+gr.dataset.g)}
  else draw();
 }else{var s=e.target.closest('section');if(s)moveGroup(d.g,+s.dataset.g);else draw()}
});
mEl.addEventListener('dragend',function(){DR=null;clr()});

/* init */
$('lg').innerHTML=ico('app');$('si').innerHTML=ico('search');$('pi').innerHTML=ico('plus');$('ds').innerHTML=DOTS;
$('si').style.cssText='display:grid;font-size:16px';
draw();
</script>
</body>
</html>
