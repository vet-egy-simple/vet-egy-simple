<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فواتير المخزن</title>
<meta name="theme-color" content="#b3191c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فواتير المخزن">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-family:Tahoma,Arial,sans-serif;color:#6a7872;transition:opacity .4s}
  #ld img{width:96px;height:96px;border-radius:50%;margin-bottom:12px;display:block}
  #ld div{text-align:center}
</style>
</head>
<body>
<div id="ld"><div><img src="icons/icon-192.png" alt=""><div>جاري التحميل...</div></div></div>
<iframe id="app" title="فواتير المخزن" allow="clipboard-write; clipboard-read; fullscreen; downloads"
  src="https://script.google.com/macros/s/AKfycby79st9iYG12e3ycvSiLSxoI4IhoNIKxs69DP-KKNVCWMRxyuSrBGuNuZg1TZW8bBM/exec"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function(){
    var l=document.getElementById('ld'); l.style.opacity=0; setTimeout(function(){l.style.display='none'},450);
  });
  // تثبيت مباشر: الصفحة دي هي اللي بتلقط حدث التثبيت، والسيستم اللي جوه بيطلبه منها
  var evt=null, src=null;
  function tell(m){ try{ if(src) src.postMessage(m,'*') }catch(e){} }
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); evt=e; });
  window.addEventListener('appinstalled', function(){ evt=null; tell({vetInstalled:1}); });
  window.addEventListener('message', function(e){
    var d=e.data||{};
    if(!d.vetHello && !d.vetInstall) return;
    src=e.source;
    if(d.vetHello){ if(standalone) tell({vetInstalled:1}); }
    if(d.vetInstall){
      if(standalone){ tell({vetInstalled:1}); }
      else if(evt){ var p=evt; evt=null; p.prompt(); p.userChoice.then(function(c){ if(c&&c.outcome==='accepted') tell({vetInstalled:1}); else evt=p; }).catch(function(){}); }
      else tell({vetNoPrompt:1});
    }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
